spring:
  application:
    name: studyos

  datasource:
    url: jdbc:postgresql://localhost:5432/studyos
    username: studyos
    password: studyos

  jpa:
    hibernate:
      # Le schema est cree et versionne par Flyway, jamais genere par Hibernate.
      # 'validate' echoue au demarrage si une entite ne correspond pas au schema.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

# CORS : application locale mono-utilisateur, seul le front Vite est autorise.
studyos:
  cors:
    allowed-origin: http://localhost:5173

server:
  port: 8080

logging:
  level:
    org.example.studyos: DEBUG
