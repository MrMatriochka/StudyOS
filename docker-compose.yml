services:
  db:
    image: postgres:16
    container_name: studyos-db
    environment:
      POSTGRES_DB: studyos
      POSTGRES_USER: studyos
      POSTGRES_PASSWORD: studyos
    ports:
      - "5432:5432"
    volumes:
      - studyos-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studyos -d studyos"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  studyos-pgdata:
